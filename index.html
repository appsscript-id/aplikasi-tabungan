<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabungan Saya</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <!-- Tampilan login / daftar -->
    <section id="auth-view" hidden>
      <h1>Tabungan Saya</h1>
      <p class="sub" id="auth-title">Masuk ke akunmu</p>

      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="6"
               autocomplete="current-password" />

        <button type="submit" id="auth-btn">Masuk</button>
      </form>

      <p id="msg" class="msg" hidden></p>

      <p class="switch">
        <span id="switch-text">Belum punya akun?</span>
        <a href="#" id="switch-link">Daftar</a>
      </p>
    </section>

    <!-- Tampilan setelah login (sementara) -->
        <section id="home-view" hidden>
      <div class="topbar">
        <span id="user-email"></span>
        <button id="logout-btn" class="link">Keluar</button>
      </div>

      <div class="saldo-box">
        <span>Saldo</span>
        <strong id="saldo">Rp 0</strong>
      </div>

      <form id="trx-form">
        <label for="tipe">Jenis</label>
        <select id="tipe">
          <option value="setor">Setor (uang masuk)</option>
          <option value="tarik">Tarik (uang keluar)</option>
        </select>

        <label for="jumlah">Jumlah (Rp)</label>
        <input id="jumlah" type="number" min="1" step="1" required inputmode="numeric" />

        <label for="catatan">Catatan (opsional)</label>
        <input id="catatan" type="text" maxlength="100" />

        <label for="tanggal">Tanggal</label>
        <input id="tanggal" type="date" required />

        <button type="submit" id="trx-btn">Simpan</button>
      </form>

      <p id="trx-msg" class="msg" hidden></p>

      <h2>Riwayat</h2>
      <ul id="riwayat" class="riwayat"></ul>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
